name: build-ws63-rust

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/name to publish a release under (e.g. v1.96.0). Empty = artifact only.'
        required: false
        default: ''

# Builds a stable rustc with the WS63 target `riscv32imfc-unknown-none-elf`
# (RV32IMFC_Zicsr, hardware single-float ilp32f, no atomics) baked in as a
# builtin, packages the sysroot, and publishes it as a release asset (on a tag,
# or a manual run with an `tag` input).

# action-gh-release creates/updates a GitHub Release → needs contents:write.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        # libssl-dev + pkg-config are required to build cargo (openssl-sys); the rest
        # for the rustc/library build. compiler-builtins is pure-Rust (config.toml), so
        # no RISC-V cross C compiler is needed.
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 git curl libssl-dev pkg-config

      - name: Fetch rust source (pinned stable tag)
        run: scripts/fetch-rust.sh "$GITHUB_WORKSPACE/rust"

      - name: Inject WS63 builtin target
        run: scripts/apply-target.sh "$GITHUB_WORKSPACE/rust"

      - name: Build rustc + cargo + core for riscv32imfc
        run: scripts/build.sh "$GITHUB_WORKSPACE/rust" "$(nproc)"

      - name: Smoke-test the target is builtin (no build-std)
        run: |
          RUSTC="$GITHUB_WORKSPACE/rust/build/x86_64-unknown-linux-gnu/stage2/bin/rustc"
          "$RUSTC" --print target-list | grep -x riscv32imfc-unknown-none-elf
          "$RUSTC" --target riscv32imfc-unknown-none-elf --print cfg | grep -E 'target_arch|target_abi|target_feature="f"' || true

      - name: Package sysroot
        run: scripts/package.sh "$GITHUB_WORKSPACE/rust" "$GITHUB_WORKSPACE/dist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ws63-rust-toolchain
          path: dist/*

      - name: Publish release (on tag, or manual run with a `tag` input)
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ws63-rust ${{ inputs.tag || github.ref_name }} (riscv32imfc hard-float)
          body: |
            Custom Rust toolchain for the HiSilicon WS63 (RISC-V RV32IMFC_Zicsr,
            hard-float ilp32f, no atomics). The `riscv32imfc-unknown-none-elf`
            target is **builtin** — downstream builds need no `-Z build-std`.

            Install:
            ```
            tar xzf ws63-rust-*-x86_64-unknown-linux-gnu.tar.gz
            rustup toolchain link ws63 "$PWD/stage2"
            ```

            Sysroot ships: rustc + cargo + rustfmt + clippy + rustdoc,
            `rust-analyzer-proc-macro-srv` (LSP proc-macro expansion), rust-src,
            llvm-tools (`rust-objcopy` …), `rust-gdb` / `rust-lldb` + pretty-printers,
            and precompiled core/alloc for the target.
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
