name: build-hisi-riscv-rust

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/name to publish a release under (e.g. v1.96.0-2). Empty = build artifacts only, no release.'
        required: false
        default: ''

# Builds a stable rustc with the riscv32imfc-unknown-none-elf target (RV32IMFC_Zicsr,
# hard-float ilp32f, no atomics) baked in as a builtin, for EVERY host platform in the
# matrix, packages each sysroot, and (on a tag, or a manual run with a `tag` input)
# publishes them all as assets of one GitHub Release.
#
# The toolchain is chip-neutral (ws63 + bs2x both build for riscv32imfc). The rustup
# channel / artifact identity is `hisi-riscv` (downstream `rustup toolchain link hisi-riscv`
# + every rust-toolchain.toml), so the tarballs keep the `hisi-riscv-rust-*` prefix.

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.host }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            host: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            host: aarch64-unknown-linux-gnu
          # No Intel-macOS leg: GitHub retired the free `macos-13` Intel runner
          # (2025-12), so an x86_64-apple-darwin job never gets scheduled and would
          # block the release. Apple-Silicon (macos-14) covers macOS; Intel-mac
          # users can build from source via scripts/build-all.sh.
          - os: macos-14          # Apple-Silicon runner
            host: aarch64-apple-darwin
          - os: windows-latest    # best-effort (bash scripts via git-bash + MSVC)
            host: x86_64-pc-windows-msvc
            experimental: true
    defaults:
      run:
        shell: bash
    env:
      HOST: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 git curl libssl-dev pkg-config

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # python3/git/curl ship with the runner; pkg-config + openssl for cargo's openssl-sys.
          brew install pkg-config openssl@3 || true

      # Windows: python, git (git-bash), and MSVC ship with windows-latest. No extra deps.

      - name: Fetch rust source (pinned stable tag)
        run: scripts/fetch-rust.sh "$GITHUB_WORKSPACE/rust"

      - name: Inject the riscv32imfc builtin target
        run: scripts/apply-target.sh "$GITHUB_WORKSPACE/rust"

      - name: Build rustc + cargo + core for ${{ matrix.host }} + riscv32imfc
        run: scripts/build.sh "$GITHUB_WORKSPACE/rust"

      - name: Smoke-test the target is builtin (no build-std)
        run: |
          EXE=""; case "$HOST" in *windows*) EXE=".exe";; esac
          RUSTC="$GITHUB_WORKSPACE/rust/build/$HOST/stage2/bin/rustc$EXE"
          "$RUSTC" --print target-list | grep -x riscv32imfc-unknown-none-elf
          "$RUSTC" --target riscv32imfc-unknown-none-elf --print cfg | grep -E 'target_arch|target_abi|target_feature="f"' || true

      - name: Package sysroot
        run: scripts/package.sh "$GITHUB_WORKSPACE/rust" "$GITHUB_WORKSPACE/dist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-${{ matrix.host }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    # Run even if a best-effort (experimental) leg failed; publish whatever built.
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/') || inputs.tag != '') }}
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: toolchain-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Publish GitHub Release (all platforms)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: hisi-riscv-rust ${{ inputs.tag || github.ref_name }} (riscv32imfc hard-float)
          body: |
            Custom Rust toolchain for the HiSilicon RISC-V family (WS63 + BS2X /
            BS20·BS21·BS22), target `riscv32imfc-unknown-none-elf` (RV32IMFC_Zicsr,
            hard-float ilp32f, no atomics) **builtin** — downstream builds need no
            `-Z build-std`.

            Multi-platform: linux x86_64/aarch64, macOS x86_64/aarch64, windows x86_64
            (a tarball per host; the Windows build is best-effort).

            Install (pick the tarball for your host; the rustup channel is `hisi-riscv`):
            ```
            tar xzf hisi-riscv-rust-*-<your-host>.tar.gz
            rustup toolchain link hisi-riscv "$PWD/stage2"
            ```

            Each sysroot ships: rustc + cargo + rustfmt + clippy + rustdoc,
            `rust-analyzer-proc-macro-srv`, rust-src, llvm-tools (`rust-objcopy` …),
            and precompiled core/alloc for the target. Unix builds also include
            `rust-gdb` / `rust-lldb` + pretty-printers.
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
