name: official-rust-toolchain-radar

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# This repo is now the external radar for the official upstream Rust target
# `riscv32imfc-unknown-none-elf`. It no longer publishes custom rustc tarballs by
# default. The legacy build/release jobs are left below, disabled, only as a
# historical reference for old releases.

permissions:
  contents: read

jobs:
  radar:
    name: latest nightly target radar
    runs-on: ubuntu-latest
    env:
      TARGET: riscv32imfc-unknown-none-elf
    steps:
      - uses: actions/checkout@v4

      - name: Install latest nightly
        run: |
          rustup toolchain install nightly \
            --profile minimal \
            --component rust-src \
            --component clippy \
            --component rustfmt
          rustc +nightly --version

      - name: Check rustc target-list
        run: |
          rustc +nightly --print target-list | tee target-list.txt
          grep -x "$TARGET" target-list.txt

      - name: Check rustup std component status
        run: |
          rustup target list --toolchain nightly | tee rustup-target-list.txt
          if grep -Eq "^${TARGET}([[:space:]]|$)" rustup-target-list.txt; then
            echo "RUSTUP_STD_COMPONENT=present" >> "$GITHUB_ENV"
          else
            echo "RUSTUP_STD_COMPONENT=absent" >> "$GITHUB_ENV"
            echo "rustup has no prebuilt std for $TARGET yet; build-std remains required"
          fi

      - name: Clone hisi-riscv-rs canary
        run: git clone --recurse-submodules https://github.com/hispark-rs/hisi-riscv-rs canary

      - name: Build firmware canary with official nightly
        working-directory: canary
        run: cargo +nightly build -Zbuild-std=core,alloc -p blinky --release

      - name: Check runtime canary with official nightly
        working-directory: canary
        run: cargo +nightly check -Zbuild-std=core,alloc -p hisi-riscv-rt --target "$TARGET"

      - name: Write radar summary
        run: |
          {
            echo "## riscv32imfc upstream radar"
            echo
            echo "- rustc: $(rustc +nightly --version)"
            echo "- target-list: present"
            echo "- rustup std component: ${RUSTUP_STD_COMPONENT}"
            echo "- build-std canary: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload radar evidence
        uses: actions/upload-artifact@v4
        with:
          name: upstream-radar-evidence
          path: |
            target-list.txt
            rustup-target-list.txt

  build:
    if: ${{ false }}
    name: build (${{ matrix.host }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            host: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            host: aarch64-unknown-linux-gnu
          # No Intel-macOS leg: GitHub retired the free `macos-13` Intel runner
          # (2025-12), so an x86_64-apple-darwin job never gets scheduled and would
          # block the release. Apple-Silicon (macos-14) covers macOS; Intel-mac
          # users can build from source via scripts/build-all.sh.
          - os: macos-14          # Apple-Silicon runner
            host: aarch64-apple-darwin
          - os: windows-latest    # best-effort (bash scripts via git-bash + MSVC)
            host: x86_64-pc-windows-msvc
            experimental: true
    defaults:
      run:
        shell: bash
    env:
      HOST: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 git curl libssl-dev pkg-config

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # python3/git/curl ship with the runner; pkg-config + openssl for cargo's openssl-sys.
          brew install pkg-config openssl@3 || true

      # Windows: python, git (git-bash), and MSVC ship with windows-latest. No extra deps.

      - name: Fetch rust source (pinned stable tag)
        run: scripts/fetch-rust.sh "$GITHUB_WORKSPACE/rust"

      - name: Inject the riscv32imfc builtin target
        run: scripts/apply-target.sh "$GITHUB_WORKSPACE/rust"

      - name: Build rustc + cargo + core for ${{ matrix.host }} + riscv32imfc
        run: scripts/build.sh "$GITHUB_WORKSPACE/rust"

      - name: Smoke-test the target is builtin (no build-std)
        run: |
          EXE=""; case "$HOST" in *windows*) EXE=".exe";; esac
          RUSTC="$GITHUB_WORKSPACE/rust/build/$HOST/stage2/bin/rustc$EXE"
          "$RUSTC" --print target-list | grep -x riscv32imfc-unknown-none-elf
          "$RUSTC" --target riscv32imfc-unknown-none-elf --print cfg | grep -E 'target_arch|target_abi|target_feature="f"' || true

      - name: Package sysroot
        run: scripts/package.sh "$GITHUB_WORKSPACE/rust" "$GITHUB_WORKSPACE/dist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-${{ matrix.host }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    if: ${{ false }}
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: toolchain-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Publish GitHub Release (all platforms)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: hisi-riscv-rust ${{ inputs.tag || github.ref_name }} (riscv32imfc hard-float)
          body: |
            Custom Rust toolchain for the HiSilicon RISC-V family (WS63 + BS2X /
            BS20·BS21·BS22), target `riscv32imfc-unknown-none-elf` (RV32IMFC_Zicsr,
            hard-float ilp32f, no atomics) **builtin** — downstream builds need no
            `-Z build-std`.

            Multi-platform: linux x86_64/aarch64, macOS x86_64/aarch64, windows x86_64
            (a tarball per host; the Windows build is best-effort).

            Install (pick the tarball for your host; the rustup channel is `hisi-riscv`).
            Extract straight into rustup's toolchains dir — rustup auto-discovers it,
            no `rustup toolchain link` needed and the toolchain is self-contained:
            ```
            mkdir -p ~/.rustup/toolchains/hisi-riscv
            tar xzf hisi-riscv-rust-*-<your-host>.tar.gz --strip-components=1 -C ~/.rustup/toolchains/hisi-riscv
            ```

            Each sysroot ships: rustc + cargo + rustfmt + clippy + rustdoc,
            `rust-analyzer-proc-macro-srv`, a self-contained rust-src (materialized,
            not a symlink), llvm-tools (`rust-objcopy` …), and precompiled core/alloc
            for the target. Unix builds also include `rust-gdb` / `rust-lldb` + pretty-printers.
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
